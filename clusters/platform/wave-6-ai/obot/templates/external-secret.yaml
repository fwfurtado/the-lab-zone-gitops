---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obot-credentials
  namespace: "{{ .Release.Namespace }}"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: "{{ .Values.secret.name }}"
    creationPolicy: Owner
    template:
      data:
        OBOT_SERVER_DSN: |-
          postgres://obot:{{ "{{ .databasePassword | urlquery }}" }}@postgres.database.svc.cluster.local:5432/obot?sslmode=disable
        OBOT_SERVER_HOSTNAME: |-
          https://{{ .Values.ingress.host }}
        OBOT_SERVER_ENABLE_AUTHENTICATION: |-
          "true"
        OBOT_SERVER_AUTH_OWNER_EMAILS: |-
          {{ "{{ .ownerEmails }}" }}
        OBOT_SERVER_AUTH_ADMIN_EMAILS: |-
          {{ "{{ .ownerEmails }}" }}
        OBOT_BOOTSTRAP_TOKEN: |-
          {{ "{{ .bootstrapToken }}" }}
        OBOT_SERVER_ENCRYPTION_KEY: |-
          {{ "{{ .encryptionKey }}" }}
        OBOT_SERVER_MCPRUNTIME_BACKEND: |-
          kubernetes
        OBOT_SERVER_MCPNAMESPACE: |-
          obot-mcp
        OBOT_SERVER_SERVICE_NAME: |-
          obot
        OBOT_SERVER_SERVICE_NAMESPACE: |-
          {{ .Release.Namespace }}
        OBOT_SERVER_DISABLE_UPDATE_CHECK: |-
          "true"
        OBOT_SERVER_AUDIT_LOGS_MODE: |-
          disk
        OBOT_SERVER_MCPDEFAULT_DENY_ALL_EGRESS: |-
          "false"
  data:
    - secretKey: databasePassword
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: "{{ .Values.secret.remoteRefs.databasePassword }}"
    - secretKey: encryptionKey
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: "{{ .Values.secret.remoteRefs.encryptionKey }}"
    - secretKey: bootstrapToken
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: "{{ .Values.secret.remoteRefs.bootstrapToken }}"
    - secretKey: ownerEmails
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: "{{ .Values.secret.remoteRefs.ownerEmails }}"
