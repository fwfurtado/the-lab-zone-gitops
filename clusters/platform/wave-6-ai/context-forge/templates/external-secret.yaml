---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: context-forge-postgres
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secret.postgresSecretName | quote }}
    creationPolicy: Owner
    template:
      data:
        host: postgres.database.svc.cluster.local
        port: "5432"
        dbname: context_forge
        user: context_forge
        password: {{ "{{ .databasePassword }}" | quote }}
  data:
    - secretKey: databasePassword
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: {{ .Values.secret.remoteRefs.databasePassword | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: context-forge-gateway
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secret.gatewaySecretName | quote }}
    creationPolicy: Owner
    template:
      data:
        BASIC_AUTH_USER: admin
        BASIC_AUTH_PASSWORD: {{ "{{ .adminPassword }}" | quote }}
        API_ALLOW_BASIC_AUTH: "false"
        AUTH_REQUIRED: "true"
        MCP_REQUIRE_AUTH: "true"
        JWT_SECRET_KEY: {{ "{{ .jwtSecret }}" | quote }}
        JWT_ALGORITHM: HS256
        JWT_AUDIENCE: mcpgateway-api
        JWT_ISSUER: mcpgateway
        TOKEN_EXPIRY: "10080"
        REQUIRE_TOKEN_EXPIRATION: "true"
        REQUIRE_JTI: "true"
        REQUIRE_USER_IN_DB: "false"
        AUTH_ENCRYPTION_SECRET: {{ "{{ .encryptionSecret }}" | quote }}
        ALLOW_UNAUTHENTICATED_ADMIN: "false"
        TRUST_PROXY_AUTH_DANGEROUSLY: "false"
        PUBLIC_REGISTRATION_ENABLED: "false"

        EMAIL_AUTH_ENABLED: "true"
        PROTECT_ALL_ADMINS: "true"
        PLATFORM_ADMIN_EMAIL: {{ "{{ .adminEmail }}" | quote }}
        PLATFORM_ADMIN_PASSWORD: {{ "{{ .adminPassword }}" | quote }}
        PLATFORM_ADMIN_FULL_NAME: Platform Administrator
        DEFAULT_USER_PASSWORD: {{ "{{ .adminPassword }}" | quote }}
        ADMIN_REQUIRE_PASSWORD_CHANGE_ON_BOOTSTRAP: "true"

        PASSWORD_POLICY_ENABLED: "true"
        PASSWORD_MIN_LENGTH: "12"
        MIN_PASSWORD_LENGTH: "12"
        MIN_SECRET_LENGTH: "32"
        REQUIRE_STRONG_SECRETS: "true"
        PASSWORD_REQUIRE_UPPERCASE: "true"
        PASSWORD_REQUIRE_LOWERCASE: "true"
        PASSWORD_REQUIRE_NUMBERS: "false"
        PASSWORD_REQUIRE_SPECIAL: "true"

        MCP_CLIENT_AUTH_ENABLED: "true"
        TOKEN_USAGE_LOGGING_ENABLED: "true"
        SSO_ENABLED: "false"
        SSO_GITHUB_ENABLED: "false"
        SSO_GOOGLE_ENABLED: "false"
        SSO_IBM_VERIFY_ENABLED: "false"
        SSO_OKTA_ENABLED: "false"
        SSO_KEYCLOAK_ENABLED: "false"
        SSO_ENTRA_ENABLED: "false"
        SSO_GENERIC_ENABLED: "false"
        SSO_ADFS_ENABLED: "false"

        DEFAULT_ADMIN_ROLE: platform_admin
        DEFAULT_USER_ROLE: platform_viewer
        AUTO_CREATE_PERSONAL_TEAMS: "false"
        ALLOW_TEAM_CREATION: "false"
        ALLOW_TEAM_JOIN_REQUESTS: "false"
        ALLOW_TEAM_INVITATIONS: "false"

        SSRF_BLOCKED_NETWORKS: '["169.254.169.254/32","169.254.169.123/32","fd00::1/128","169.254.0.0/16","fe80::/10"]'
        SSRF_BLOCKED_HOSTS: '["metadata.google.internal","metadata.internal"]'

        REDIS_URL: redis://:{{ "{{ .valkeyPassword }}" }}@valkey-primary.valkey.svc.cluster.local:6379/5
        METRICS_TOKEN: {{ "{{ .metricsToken }}" | quote }}
  data:
    - secretKey: adminEmail
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: {{ .Values.secret.remoteRefs.adminEmail | quote }}
    - secretKey: adminPassword
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: {{ .Values.secret.remoteRefs.adminPassword | quote }}
    - secretKey: valkeyPassword
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: {{ .Values.secret.remoteRefs.valkeyPassword | quote }}
    - secretKey: jwtSecret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: {{ .Values.secret.remoteRefs.jwtSecret | quote }}
    - secretKey: encryptionSecret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: {{ .Values.secret.remoteRefs.encryptionSecret | quote }}
    - secretKey: metricsToken
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: {{ .Values.secret.remoteRefs.metricsToken | quote }}
