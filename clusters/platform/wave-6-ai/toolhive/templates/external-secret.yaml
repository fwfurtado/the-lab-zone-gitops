{{- if and .Values.secrets.grafana.enabled .Values.mcp.servers.grafana.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-grafana-credentials
  namespace: {{ .Values.runtimeNamespace.name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.grafana.name }}
    creationPolicy: Owner
  data:
    - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: {{ .Values.secrets.grafana.remoteRefs.serviceAccountToken }}
{{- end }}
{{- if .Values.secrets.registry.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-registry-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.registry.name }}
    creationPolicy: Owner
  data:
    - secretKey: database-password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: {{ .Values.secrets.registry.remoteRefs.databasePassword }}
{{- end }}
