---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPGroup
metadata:
  name: {{ .Values.mcp.group.name }}
  namespace: {{ .Values.runtimeNamespace.name }}
spec:
  description: {{ .Values.mcp.group.description | quote }}
{{- if .Values.mcp.telemetry.enabled }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPTelemetryConfig
metadata:
  name: {{ .Values.mcp.telemetry.name }}
  namespace: {{ .Values.runtimeNamespace.name }}
spec:
  prometheus:
    enabled: {{ .Values.mcp.telemetry.prometheus.enabled }}
{{- end }}
{{- $groupName := .Values.mcp.group.name }}
{{- $telemetryEnabled := .Values.mcp.telemetry.enabled }}
{{- $telemetryName := .Values.mcp.telemetry.name }}
{{- $defaults := .Values.mcp.defaults }}
{{- range $key, $server := .Values.mcp.servers }}
{{- if $server.enabled }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: {{ $server.name }}
  namespace: {{ $.Values.runtimeNamespace.name }}
spec:
  image: {{ $server.image }}
  transport: {{ $server.transport }}
  proxyPort: {{ default $defaults.proxyPort $server.proxyPort }}
  mcpPort: {{ $server.mcpPort }}
  groupRef:
    name: {{ $groupName }}
  {{- if $server.serviceAccountName }}
  serviceAccount: {{ $server.serviceAccountName }}
  {{- end }}
  {{- if $server.permissionProfile }}
  permissionProfile:
    {{- toYaml $server.permissionProfile | nindent 4 }}
  {{- end }}
  {{- if $telemetryEnabled }}
  telemetryConfigRef:
    name: {{ $telemetryName }}
  {{- end }}
  {{- if $server.env }}
  env:
    {{- range $name, $value := $server.env }}
    - name: {{ $name }}
      value: {{ $value | quote }}
    {{- end }}
  {{- end }}
  {{- if $server.secretName }}
  secrets:
    - name: {{ $server.secretName }}
      key: GRAFANA_SERVICE_ACCOUNT_TOKEN
      targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
  {{- end }}
  resources:
    {{- toYaml (default $defaults.resources $server.resources) | nindent 4 }}
{{- end }}
{{- end }}
{{- if .Values.mcp.virtual.enabled }}
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: {{ .Values.mcp.virtual.name }}
  namespace: {{ .Values.runtimeNamespace.name }}
spec:
  groupRef:
    name: {{ .Values.mcp.group.name }}
  incomingAuth:
    type: {{ .Values.mcp.virtual.incomingAuth.type }}
  {{- if .Values.mcp.telemetry.enabled }}
  telemetryConfigRef:
    name: {{ .Values.mcp.telemetry.name }}
  {{- end }}
  replicas: {{ .Values.mcp.virtual.replicas }}
  resources:
    {{- toYaml .Values.mcp.virtual.resources | nindent 4 }}
{{- end }}
