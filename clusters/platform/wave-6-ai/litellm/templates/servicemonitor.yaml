---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/name: litellm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/instance: litellm
  namespaceSelector:
    matchNames:
      - "{{ .Release.Namespace }}"
  endpoints:
    - port: http
      path: /metrics/
      interval: "{{ .Values.monitoring.serviceMonitor.interval }}"
      scrapeTimeout: "{{ .Values.monitoring.serviceMonitor.scrapeTimeout }}"
      authorization:
        type: Bearer
        credentials:
          name: "{{ .Values.monitoring.serviceMonitor.authorization.secretName }}"
          key: "{{ .Values.monitoring.serviceMonitor.authorization.secretKey }}"
