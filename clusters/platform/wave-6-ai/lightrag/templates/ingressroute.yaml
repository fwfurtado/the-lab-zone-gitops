---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lightrag
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      middlewares:
        - name: {{ .Values.ingress.headersMiddlewareName }}
          namespace: {{ .Values.ingress.headersMiddlewareNamespace }}
        - name: {{ .Values.ingress.authMiddlewareName }}
          namespace: {{ .Values.ingress.authMiddlewareNamespace }}
      services:
        - name: {{ include "lightrag.fullname" . }}
          port: {{ .Values.service.port }}
  tls:
    secretName: {{ .Values.ingress.tlsSecretName }}
