apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lightrag-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
    template:
      data:
        .env: |-
{{ include "lightrag.envContent" . | indent 10 }}
          LIGHTRAG_API_KEY={{ "{{ .apiKey }}" }}
          LLM_BINDING_API_KEY={{ "{{ .llmApiKey }}" }}
          EMBEDDING_BINDING_API_KEY={{ "{{ .embeddingApiKey }}" }}
          NEO4J_PASSWORD={{ "{{ .neo4jPassword }}" }}
          REDIS_PASSWORD={{ "{{ .redisPassword }}" }}
          REDIS_URI=redis://:{{ "{{ .redisPassword }}" }}@valkey-primary.valkey.svc.cluster.local:6379/3
  data:
    - secretKey: apiKey
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: {{ .Values.secret.remoteRefs.apiKey }}
    - secretKey: llmApiKey
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: {{ .Values.secret.remoteRefs.llmApiKey }}
    - secretKey: embeddingApiKey
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: {{ .Values.secret.remoteRefs.embeddingApiKey }}
    - secretKey: neo4jPassword
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: {{ .Values.secret.remoteRefs.neo4jPassword }}
    - secretKey: redisPassword
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: {{ .Values.secret.remoteRefs.redisPassword }}
