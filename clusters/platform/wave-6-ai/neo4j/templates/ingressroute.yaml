---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: neo4j-browser
  namespace: "{{ .Release.Namespace }}"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      middlewares:
        - name: "{{ .Values.ingress.headersMiddlewareName }}"
          namespace: "{{ .Values.ingress.headersMiddlewareNamespace }}"
      services:
        - name: neo4j
          port: 7474
  tls:
    secretName: "{{ .Values.ingress.tlsSecretName }}"
