---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: neo4j-bolt
  namespace: "{{ .Release.Namespace }}"
spec:
  entryPoints:
    - bolt
  routes:
    - match: HostSNI(`{{ .Values.ingress.host }}`)
      services:
        - name: neo4j
          port: 7687
  tls:
    secretName: "{{ .Values.ingress.tlsSecretName }}"
